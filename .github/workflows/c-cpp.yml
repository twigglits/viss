name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            vrust
      - name: Run Rust tests (vrust)
        working-directory: vrust
        run: cargo test --workspace --all-targets -- --nocapture

      # GITHUB_TOKEN is minted per run and cannot expire. It works because the package's
      # Actions access grants this repository the Write role — it was set to Read, which
      # is what produced "permission_denied: write_package" and sent an earlier attempt
      # chasing PATs and GitHub Apps. Check that role first if pushes start failing.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set short SHA
        id: vars
        run: echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV
      - name: Build Docker image (latest and versioned)
        run: |
          docker build --no-cache -f vrust/Dockerfile \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t ghcr.io/${{ github.repository }}:latest -t ghcr.io/${{ github.repository }}:${{ env.SHORT_SHA }} vrust
      - name: Push Docker image (latest)
        run: docker push ghcr.io/${{ github.repository }}:latest
      - name: Push Docker image (versioned)
        run: docker push ghcr.io/${{ github.repository }}:${{ env.SHORT_SHA }}

  # Ships the image the build job just published. Backend only — the frontend has its
  # own deploy in the viss-frontend repo, and neither touches the other.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production
        env:
          KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$KEY" || { echo "PROD_SSH_KEY is empty"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
          # The server pins this key to a forced command; the command sent is ignored.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes twigg@157.90.172.175 deploy

  increment-version:
    name: Increment Version and Release
    needs: build
    runs-on: ubuntu-latest
    # Lets the built-in token push the tag and cut the release. VISS_RELEASE_TOKEN
    # expired 2026-06-17; GITHUB_TOKEN is minted per run and cannot.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tags are needed to work out the current version
      - name: Tag and release the next patch version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"
          next="v${major}.${minor}.$((patch + 1))"
          echo "latest=$latest next=$next"
          git tag "$next"
          git push origin "$next"
          gh release create "$next" --title "Release $next" --generate-notes
